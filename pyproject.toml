[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-compiler"
version = "0.1.0"
description = "A semantic→executable compiler for process-bigraph: install conforming handlers for draft-process signatures while preserving the interface."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-compiler"

[tool.hatch.build.targets.wheel]
packages = ["viva_compiler"]
